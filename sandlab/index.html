<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>SandLab VR — sandbox para Pico G2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;font-family:Roboto,system-ui,sans-serif;color:#e8eaed;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0b0e14cc,#0b0e14f2),radial-gradient(900px 500px at 70% 20%,#f2c31b33,transparent);z-index:5;transition:opacity .4s}
#overlay.hide{opacity:0;pointer-events:none}
.card{width:min(720px,92vw);padding:30px 34px;border-radius:24px;background:#141925e6;border:1px solid #f2c31b44;text-align:center}
h1{margin:0;font-size:clamp(38px,7vw,64px);letter-spacing:4px;color:#f2c31b;font-weight:900}.sub{color:#aab2c5;margin:6px 0 20px}
button{display:block;width:100%;margin:10px 0;padding:16px 20px;border:0;border-radius:14px;font:700 19px inherit;font-family:inherit;color:#111;cursor:pointer;background:#f2c31b}
button.alt{background:#232a3b;color:#fff}button[disabled]{opacity:.45;cursor:not-allowed}
button small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:4px}
#msg{min-height:20px;margin-top:8px;font-size:14px;color:#ffb4a9}.tips{margin-top:10px;font-size:13px;color:#8d96ad;line-height:1.6}
</style></head><body>
<canvas id="view"></canvas>
<div id="overlay"><div class="card">
<h1>SANDLAB</h1><p class="sub">Sandbox de mundo aberto em VR · armas, bonecos com física, objetos · feito para o Pico G2</p>
<button id="btnXR" disabled>🥽 Entrar em VR (WebXR)<small id="xrNote">Verificando suporte…</small></button>
<button id="btnGyro" class="alt">🧭 Tela cheia + giroscópio<small>Sem WebXR: mexa a cabeça para olhar · toque na tela = R2</small></button>
<button id="btnSplit" class="alt">📱 Modo óculos — tela dividida</button>
<button id="btnFlat" class="alt">🖥️ Jogar no PC<small>WASD anda · mouse mira · clique atira/pega · botão direito ou E pega/solta · Q menu · R recarrega</small></button>
<div id="msg"></div>
<div class="tips"><b>Controle do Pico:</b> <b>R2</b> (gatilho de trás) atira / segura objeto · <b>clique do meio</b> pega e solta armas e objetos · deslize o <b>touch</b> para andar · segure o clique do meio para abrir o menu</div>
</div></div>
<script src="lib/three.min.js"></script>
<script src="js/tex.js"></script>
<script src="js/world.js"></script>
<script src="js/dummy.js"></script>
<script src="js/items.js"></script>
<script src="js/game.js"></script>
</body></html>
