name: Ping-Pong VR APK
on:
  workflow_dispatch:
  push:
    paths: ['pingpong/**', '.github/workflows/pingpong.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copia o jogo para os assets do app
        run: |
          mkdir -p pingpong/android/app/src/main/assets
          cp -r pingpong/index.html pingpong/js pingpong/lib pingpong/android/app/src/main/assets/
      - name: Compila o APK
        working-directory: pingpong/android
        run: gradle assembleDebug --no-daemon
      - name: Publica numa Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pingpong/android/app/build/outputs/apk/debug/app-debug.apk PingPong-VR.apk
          gh release delete pingpong-latest --cleanup-tag -y || true
          gh release create pingpong-latest PingPong-VR.apk --target "$GITHUB_SHA" --title "Ping-Pong VR (Pico G2)" --notes "APK do Ping-Pong VR. Instale com: adb install PingPong-VR.apk. Para WebXR de verdade use o link do GitHub Pages /pingpong/."
