# Testa, compila e publica o site WebXR (pasta webxr/) na branch gh-pages.
# Para o site ficar online: Settings > Pages > Source = "Deploy from a branch" > Branch = gh-pages / (root).
# O site NÃO contém nenhum arquivo do Metulas: o usuário escolhe o APK dele na página.
name: WebXR site

on:
  push:
    branches: ["**"]
    paths: ["webxr/**", ".github/workflows/pages-webxr.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webxr-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webxr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (parsers, input mapping, arm locomotion, game logic)
        run: npm test
      - name: Build bundle
        run: npm run build
      - name: Assemble site
        run: |
          rm -rf ../_site && mkdir -p ../_site
          cp -r index.html css dist ../_site/
          rm -f ../_site/dist/*.map
          touch ../_site/.nojekyll
          find ../_site -type f | sort
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "WebXR site from ${{ github.sha }}"
