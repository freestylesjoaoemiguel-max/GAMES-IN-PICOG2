name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copia o jogo para os assets do app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html js lib android/app/src/main/assets/
      - name: Compila (APK de debug, já assinado e instalável)
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publica o APK numa Release (não usa a cota de artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PicoVerso.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest PicoVerso.apk --target "$GITHUB_SHA" --title "PicoVerso APK" --notes "APK de debug gerado automaticamente. Instale com: adb install PicoVerso.apk"
